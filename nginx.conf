# ==============================================================================
# ALTEON EXPORTS LTD - NGINX PRODUCTION MILITARY-GRADE SERVER CONFIGURATION
# Standards: CIS Nginx Benchmark, Mozilla SSL Configuration Generator (Modern)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name alteonexports.com www.alteonexports.com;

    # Enforce Immediate HTTPS Redirect
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name alteonexports.com www.alteonexports.com;

    root /var/www/alteon-exports-website;
    index index.html;

    # Security: Hide Nginx Version
    server_tokens off;

    # SSL Hardening (TLS 1.2 & TLS 1.3 only, modern secure ciphers)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Buffer Overflow & Slowloris Hardening
    client_body_buffer_size 128k;
    client_max_body_size 10M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    keepalive_timeout 65;
    send_timeout 10;

    # Military-Grade Security Headers
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-5x9NrHytWgZO8uLjVEl2vetLKTkoj9x/YQ1RehA9EgM='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'none'; form-action 'self' https:; base-uri 'self'; object-src 'none'; upgrade-insecure-requests;" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(self), usb=(), xr-spatial-tracking=(), browsing-topics=()" always;
    add_header X-XSS-Protection "0" always;

    # Prevent Access to Hidden Files, Dotfiles & Source Control (.git, .env, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block Access to Backup & Configuration Files
    location ~* \.(bak|conf|dist|fla|in[ci]|log|psd|sh|sql|sw[op]|yaml|yml)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # RFC 9116 /security.txt fallback redirect to /.well-known/security.txt
    location = /security.txt {
        return 301 /.well-known/security.txt;
    }

    location = /.well-known/security.txt {
        default_type text/plain;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Static Assets Caching & Hardening
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /css/ {
        expires 7d;
        add_header Cache-Control "public, stale-while-revalidate=86400";
    }

    location /js/ {
        expires 7d;
        add_header Cache-Control "public, stale-while-revalidate=86400";
    }

    # Main Routing
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Custom Error Pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
